name: next-development
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: next
      POSTGRES_DB: next
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先设置 POSTGRES_PASSWORD}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["next-dev-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U next -d next"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  next-dev-data:
