name: next-backend
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: next
      POSTGRES_DB: next
      POSTGRES_PASSWORD: ${DB_PASSWORD:?缺少数据库密码}
    volumes: ["next-data:/var/lib/postgresql/data"]
    # 不映射数据库端口，也不加入其他项目网络。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U next -d next"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  api:
    image: node:22-alpine
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_ORIGIN: ${APP_ORIGIN:?缺少网站来源}
      DATABASE_URL: postgresql://next:${DB_PASSWORD}@db:5432/next
    working_dir: /app
    command: ["node", "index.cjs"]
    volumes: ["/opt/next/backend-current:/app:ro"]
    ports: ["127.0.0.1:3101:3001"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 256m
    pids_limit: 128
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
volumes:
  next-data:
